<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">Zona sacra con eritema: caso SIM-076</title>
  <desc id="desc">Esquema posterior de la región lumbar y glútea. Un área roja sobre el sacro representa el enrojecimiento descrito en el caso, sin herida abierta.</desc>
